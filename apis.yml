description: The Inside is a direct-to-consumer, made-to-order home furnishings brand
  founded in 2017 by Christiane Lemieux and Britt Bunn, offering customizable upholstered
  furniture — sofas, chairs, beds, headboards, and decor — in 100+ fabrics and patterns.
  Backed by Canaan Partners along with Corigin Ventures, Lerer Hippeau, Forerunner Ventures,
  and BAM Ventures, it was acquired by Havenly in February 2022. Surfaced as a VC-portfolio
  lead in the API Evangelist network; during enrichment no public developer API, OpenAPI,
  or well-known metadata surface was found — theinside.com serves an e-commerce storefront
  with no documented programmatic interface.
